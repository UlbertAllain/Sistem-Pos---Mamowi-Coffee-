name: Quality

on:
  push:
    branches:
      - main
      - "chore/**"
      - "refactor/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run preflight
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:test"
          NEXT_PUBLIC_FIREBASE_STORE_ID: mamowi-coffee
          FIREBASE_ADMIN_PROJECT_ID: example
          FIREBASE_ADMIN_CLIENT_EMAIL: test@example.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: test-private-key

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm run check
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:test"
          NEXT_PUBLIC_FIREBASE_STORE_ID: mamowi-coffee
          FIREBASE_ADMIN_PROJECT_ID: example
          FIREBASE_ADMIN_CLIENT_EMAIL: test@example.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: test-private-key
