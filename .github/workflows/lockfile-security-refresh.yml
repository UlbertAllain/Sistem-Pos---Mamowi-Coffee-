name: Lockfile Security Refresh

on:
  push:
    branches:
      - "chore/repository-cleanup"
    paths:
      - ".github/workflows/lockfile-security-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-cleanup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lockfile
        run: npm ci

      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only

      - name: Verify lockfile
        run: npm ci

      - name: Commit lockfile refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "security: refresh vulnerable transitive dependencies"
          git push origin HEAD:chore/repository-cleanup
