name: Dependency Upgrade

on:
  push:
    branches:
      - "chore/repository-cleanup"
    paths:
      - ".github/workflows/dependency-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-cleanup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Upgrade reviewed dependencies
        run: npm install --save-exact next@16.3.5 eslint-config-next@16.3.5 firebase-admin@14.4.0

      - name: Verify install
        run: npm ci

      - name: Commit dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
            exit 0
          fi
          git commit -m "security: upgrade Next.js and Firebase Admin"
          git push origin HEAD:chore/repository-cleanup
