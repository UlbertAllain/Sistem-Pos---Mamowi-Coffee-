name: Quality

on:
  push:
    branches:
      - main
      - "chore/**"
      - "refactor/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulnerabilities = audit.vulnerabilities ?? {};
          const summary = Object.entries(vulnerabilities)
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              range: value.range,
              fixAvailable: value.fixAvailable,
            }))
            .sort((a, b) => {
              const weight = { critical: 4, high: 3, moderate: 2, low: 1 };
              return (weight[b.severity] ?? 0) - (weight[a.severity] ?? 0);
            });
          console.log("Dependency vulnerability summary:");
          console.log(JSON.stringify(summary, null, 2));
          console.log("Metadata:");
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          NODE

      - run: npm run preflight
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:test"
          NEXT_PUBLIC_FIREBASE_STORE_ID: mamowi-coffee
          FIREBASE_ADMIN_PROJECT_ID: example
          FIREBASE_ADMIN_CLIENT_EMAIL: test@example.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: test-private-key

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm run check
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456:web:test"
          NEXT_PUBLIC_FIREBASE_STORE_ID: mamowi-coffee
          FIREBASE_ADMIN_PROJECT_ID: example
          FIREBASE_ADMIN_CLIENT_EMAIL: test@example.iam.gserviceaccount.com
          FIREBASE_ADMIN_PRIVATE_KEY: test-private-key
